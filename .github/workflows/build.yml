# .github/workflows/build.yml
#
# Implements: docs/03-design/system-architecture.md section 5.6 (deployment shape,
# image tag = git SHA) and NFR-024 (every deployed build MUST be an immutable
# container image tag, tagged by the CI workflow with the git commit SHA).
#
# This workflow BUILDS and TAGS the image only. It MUST NOT push to any registry
# and MUST NOT deploy. The publish step below is present, disabled, and commented,
# for the user to enable once a registry and its credentials are decided — that
# decision was not named by any upstream artifact and is out of scope for this
# workflow (deployment-assets skill: "CI and build stay separate... Neither
# deploys").

name: Build image

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      # Build only. `push: false` keeps the image local to the runner; it is
      # discarded when the job ends. NFR-024's tag scheme is applied here so the
      # image the user later builds and pushes by hand carries the same identity.
      - name: Build image (local, not pushed)
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: |
            tams-infotech-website:${{ github.sha }}
            tams-infotech-website:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Publish step: DISABLED. Do not enable without explicit user request. ---
      # Uncomment and fill in a registry, plus a login step that reads credentials
      # from GitHub Actions secrets (never hard-coded), before this step can push.
      # This block MUST stay disabled by default; enabling it is a deployment
      # action outside the CI/CD architect's authority.
      #
      # - name: Log in to registry
      #   uses: docker/login-action@v3.3.0
      #   with:
      #     registry: <registry host, e.g. ghcr.io or a cloud provider registry>
      #     username: ${{ secrets.REGISTRY_USERNAME }}
      #     password: ${{ secrets.REGISTRY_PASSWORD }}
      #
      # - name: Push image
      #   uses: docker/build-push-action@v6.9.0
      #   with:
      #     context: .
      #     file: deploy/Dockerfile
      #     push: true
      #     tags: |
      #       <registry host>/<namespace>/tams-infotech-website:${{ github.sha }}
      #       <registry host>/<namespace>/tams-infotech-website:latest
